<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D98B"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111418" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080a0c" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="0.8" opacity="0.6"/>
      <circle cx="30" cy="30" r="1" fill="#00D98B" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Glowing background ambient light -->
  <circle cx="1050" cy="60" r="180" fill="#00D98B" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="150" cy="260" r="140" fill="#00D98B" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Neural Mesh Connections (Right Side) -->
  <g stroke="#00D98B" opacity="0.25" stroke-width="1.2">
    <line x1="900" y1="90" x2="1020" y2="140"/>
    <line x1="1020" y1="140" x2="1110" y2="80"/>
    <line x1="1020" y1="140" x2="1080" y2="220"/>
    <line x1="900" y1="90" x2="960" y2="210"/>
    <line x1="960" y1="210" x2="1080" y2="220"/>
    <line x1="1080" y1="220" x2="1140" y2="170"/>
  </g>
  <g fill="#00D98B" opacity="0.7">
    <circle cx="900" cy="90" r="4" filter="url(#emeraldGlow)"/>
    <circle cx="1020" cy="140" r="5" filter="url(#emeraldGlow)"/>
    <circle cx="1110" cy="80" r="3"/>
    <circle cx="960" cy="210" r="4"/>
    <circle cx="1080" cy="220" r="5" filter="url(#emeraldGlow)"/>
    <circle cx="1140" cy="170" r="3"/>
  </g>

  <!-- HUD Decorative Frame Elements -->
  <path d="M 30 40 L 30 25 L 45 25" stroke="#00D98B" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1170 40 L 1170 25 L 1155 25" stroke="#00D98B" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 30 280 L 30 295 L 45 295" stroke="#00D98B" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1170 280 L 1170 295 L 1155 295" stroke="#00D98B" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Main Glass Console Panel -->
  <rect x="50" y="40" width="1100" height="240" rx="12" fill="url(#panelGrad)" stroke="#00D98B" stroke-opacity="0.35" stroke-width="1.2"/>
  
  <!-- Panel Top Bar -->
  <path d="M 50 75 L 1150 75" stroke="#1F242D" stroke-width="1"/>
  <circle cx="75" cy="58" r="4" fill="#FF5F56"/>
  <circle cx="90" cy="58" r="4" fill="#FFBD2E"/>
  <circle cx="105" cy="58" r="4" fill="#27C93F"/>
  <text x="130" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="11" fill="#00D98B" letter-spacing="1.5" opacity="0.9">AI_RESEARCH_LAB_OS // NODE_NODE_01</text>

  <!-- Live Pulse Dot -->
  <circle cx="1090" cy="58" r="4" fill="#00D98B" filter="url(#emeraldGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1105" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#00D98B" letter-spacing="1">ONLINE</text>

  <!-- Terminal Content / Typography -->
  <!-- Command Prompt line -->
  <text x="80" y="115" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#00D98B" opacity="0.9">&gt; sys.initialize_researcher_profile --user="Rudra Srivastava"</text>
  
  <!-- Big Name Header -->
  <text x="80" y="165" font-family="'Inter', 'SF Pro Display', Arial, sans-serif" font-weight="900" font-size="38" fill="url(#silverGrad)" letter-spacing="1">Rudra Srivastava</text>
  <text x="440" y="165" font-family="'Inter', 'SF Pro Display', Arial, sans-serif" font-weight="700" font-size="38" fill="#00D98B" filter="url(#emeraldGlow)">_</text>

  <!-- Title / Subtitle -->
  <text x="80" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#8B949E" letter-spacing="0.8">
    <tspan fill="#00D98B" font-weight="700">FULL-STACK DEVELOPER</tspan> • <tspan fill="#E8E8E8">AI / ML ENTHUSIAST</tspan> • <tspan fill="#8B949E">B.TECH CSE</tspan>
  </text>

  <!-- Capability Badges inside banner -->
  <g transform="translate(80, 220)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#141920" stroke="#00D98B" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="18" font-family="monospace" font-size="11" fill="#00D98B">● ATS AI SYSTEMS</text>
    
    <!-- Badge 2 -->
    <rect x="162" y="0" width="165" height="28" rx="6" fill="#141920" stroke="#30363D" stroke-width="1"/>
    <text x="174" y="18" font-family="monospace" font-size="11" fill="#C9D1D9">⚡ MERN &amp; NEXT STACK</text>
    
    <!-- Badge 3 -->
    <rect x="339" y="0" width="150" height="28" rx="6" fill="#141920" stroke="#30363D" stroke-width="1"/>
    <text x="351" y="18" font-family="monospace" font-size="11" fill="#C9D1D9">🛡️ AWS CERTIFIED</text>

    <!-- Badge 4 -->
    <rect x="501" y="0" width="145" height="28" rx="6" fill="#141920" stroke="#30363D" stroke-width="1"/>
    <text x="513" y="18" font-family="monospace" font-size="11" fill="#C9D1D9">📊 NAV R² MODELS</text>
  </g>

  <!-- Subtitle Data Stream / HUD Right Side Stats -->
  <g transform="translate(840, 100)" font-family="monospace" font-size="11">
    <rect x="0" y="0" width="220" height="145" rx="8" fill="#0b0e12" stroke="#1f242c" stroke-width="1"/>
    <text x="15" y="25" fill="#8B949E" font-size="10" letter-spacing="1">LAB SYSTEM STATUS</text>
    
    <text x="15" y="50" fill="#E8E8E8">CORE STACK:</text>
    <text x="110" y="50" fill="#00D98B">REACT / NODE</text>
    
    <text x="15" y="72" fill="#E8E8E8">AI MODELS:</text>
    <text x="110" y="72" fill="#00D98B">NUMPY / PANDAS</text>

    <text x="15" y="94" fill="#E8E8E8">CLOUD DEPLOY:</text>
    <text x="110" y="94" fill="#00D98B">AWS / VERCEL</text>

    <text x="15" y="116" fill="#E8E8E8">ACCURACY R²:</text>
    <text x="110" y="116" fill="#00D98B">HIGH PREDICT</text>

    <line x1="15" y1="128" x2="205" y2="128" stroke="#1f242c"/>
  </g>
</svg>
